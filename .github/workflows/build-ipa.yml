name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Install Pods
        working-directory: ios/App
        run: |
          pod install || (pod install --repo-update)

      - name: Build iOS Archive (Unsigned / Sideloadable)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Export to .IPA file
        working-directory: ios/App
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r TG-Notifier.ipa Payload
          echo "IPA created successfully at ios/App/build/TG-Notifier.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Notifier-iOS-IPA
          path: ios/App/build/TG-Notifier.ipa
          retention-days: 30

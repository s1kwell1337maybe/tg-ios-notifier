name: Build Native Swift iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Archive (Native Swift)
        run: |
          xcodebuild \
            -project TelegramNotifier.xcodeproj \
            -scheme TelegramNotifier \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/TelegramNotifier.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Export to .IPA file
        run: |
          mkdir -p build/Payload
          cp -r build/TelegramNotifier.xcarchive/Products/Applications/TelegramNotifier.app build/Payload/
          cd build
          zip -r TG-Notifier.ipa Payload
          echo "IPA created successfully at build/TG-Notifier.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TG-Notifier-iOS-IPA
          path: build/TG-Notifier.ipa
          retention-days: 30
